name: selfcheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.3 geopy==2.4.1 geographiclib==2.1
      - name: Run selfcheck
        run: python scripts/selfcheck.py
